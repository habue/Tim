plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.3'
}

base {
    archivesName = project.archives_base_name
    version = project.mod_version
    group = project.maven_group
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.meteordev.org/releases' }
    maven { url = 'https://maven.meteordev.org/snapshots' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "meteordevelopment:meteor-client:${project.minecraft_version}-SNAPSHOT"
    compileOnly 'meteordevelopment:baritone:26.1-SNAPSHOT'
    compileOnly 'net.fabricmc.fabric-api:fabric-resource-loader-v1:2.0.9+d871b99e4c'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked', '-Xmaxerrs', '1000'])
}
