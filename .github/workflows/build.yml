name: Build Tim for Minecraft 26.1.2
on:
  push:
    branches: [meteor-26.1.2]
  pull_request:
    branches: [main, meteor-26.1.2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tim-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: Tim-26.1.2
          path: build/libs/Tim-*.jar
          if-no-files-found: error
          retention-days: 30
