name: Migrate source mappings
on:
  push:
    branches: [meteor-26.1.2]
    paths: [.github/workflows/migrate.yml]
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew migrateMappings --mappings "net.minecraft:mappings:1.21.4" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: migrated-source
          path: remappedSrc
          if-no-files-found: error
