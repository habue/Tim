name: Test port startup
on:
  push:
    branches: [meteor-26.1.2]
    paths: [.github/workflows/port-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Launch client in a virtual display
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          set +e
          timeout 120s xvfb-run -a ./gradlew runClient --no-daemon > startup.log 2>&1
          result=$?
          set -e
          cat startup.log
          if [ "$result" -ne 0 ] && [ "$result" -ne 124 ]; then exit "$result"; fi
          test -f run/logs/latest.log
          grep -q 'Tim initialized: 35 modules and 20 HUD elements registered' run/logs/latest.log
          if grep -E 'Mixin apply.*failed|InvalidMixinException|InvalidInjectionException|InjectionError|Minecraft has crashed|Reported exception thrown' startup.log run/logs/latest.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tim-startup-logs
          path: |
            startup.log
            run/logs/latest.log
            run/crash-reports
